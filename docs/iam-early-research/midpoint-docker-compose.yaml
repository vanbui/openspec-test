version: "3.3"

services:
  midpoint_data:
    image: postgres:16-alpine
    container_name: midpoint_data
    environment:
      - POSTGRES_PASSWORD=db.secret.pw.007
      - POSTGRES_USER=midpoint
      - POSTGRES_INITDB_ARGS=--lc-collate=en_US.utf8 --lc-ctype=en_US.utf8
    networks:
      - net
    volumes:
      - midpoint_data:/var/lib/postgresql/data

  data_init:
    image: evolveum/midpoint:${MP_VER:-latest}-alpine
    command: >
      bash -c "
      cd /opt/midpoint ;
      bin/midpoint.sh init-native ;
      echo ' - - - - - - ' ;
      bin/ninja.sh -B info >/dev/null 2>/tmp/ninja.log ;
      grep -q \"ERROR\" /tmp/ninja.log && (
      bin/ninja.sh run-sql --create --mode REPOSITORY  ;
      bin/ninja.sh run-sql --create --mode AUDIT
      ) ||
      echo -e '\\n Repository init is not needed...' ;
      "
    depends_on:
      - midpoint_data
    environment:
      - MP_SET_midpoint_repository_jdbcUsername=midpoint
      - MP_SET_midpoint_repository_jdbcPassword=db.secret.pw.007
      - MP_SET_midpoint_repository_jdbcUrl=jdbc:postgresql://midpoint_data:5432/midpoint
      - MP_SET_midpoint_repository_database=postgresql
      - MP_INIT_CFG=/opt/midpoint/var
      - MP_SET_midpoint_administrator_initialPassword=Strapi123!
    networks:
      - net
    volumes:
      - midpoint_home:/opt/midpoint/var

  midpoint_server:
    image: evolveum/midpoint:${MP_VER:-latest}-alpine
    container_name: midpoint
    depends_on:
      data_init:
        condition: service_completed_successfully
      midpoint_data:
        condition: service_started
    command: ["/opt/midpoint/bin/midpoint.sh", "container"]
    ports:
      - 8080:8080
    environment:
      - MP_SET_midpoint_repository_jdbcUsername=midpoint
      - MP_SET_midpoint_repository_jdbcPassword=db.secret.pw.007
      - MP_SET_midpoint_repository_jdbcUrl=jdbc:postgresql://midpoint_data:5432/midpoint
      - MP_SET_midpoint_repository_database=postgresql
      - MP_SET_midpoint_administrator_initialPassword=Strapi123!
      - MP_UNSET_midpoint_repository_hibernateHbm2ddl=1
      - MP_NO_ENV_COMPAT=1
    networks:
      - net
    volumes:
      - midpoint_home:/opt/midpoint/var

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: midpoint@example.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "5050:80"
    depends_on:
      midpoint_data:
        condition: service_started
    networks:
      - net

  samba-ad:
    image: instantlinux/samba-dc
    container_name: samba-ad
    hostname: dc1.ad.unsw.edu.au
    ports:
      - "10053:53/tcp"
      - "10053:53/udp"
      - "10088:88/tcp"
      - "10088:88/udp"
      - "10389:389"
      - "10636:636"
    networks:
      - net
    environment:
      REALM: AD.UNSW.EDU.AU
      WORKGROUP: ADUNSW
      DOMAIN_ACTION: provision
      ADMIN_PASSWORD_SECRET: samba-admin-password
      TZ: Australia/Melbourne

    secrets:
      - samba-admin-password

    volumes:
      - samba-ad-etc:/etc/samba
      - samba-ad-data:/var/lib/samba
      - "./secrets/samba-admin-password:/run/secrets/samba-admin-password:ro"

    cap_add:
      - CAP_SYS_ADMIN

secrets:
  samba-admin-password:
    file: ./secrets/samba-admin-password

networks:
  net:
    driver: bridge

volumes:
  midpoint_data:
  midpoint_home:
  samba-ad-data:
  samba-ad-etc:
