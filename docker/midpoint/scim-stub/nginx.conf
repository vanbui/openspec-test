# Disposable SCIM discovery stub for the Phase 1 connector spike (compose
# profile "scim-spike"). It serves one static /scim/v2/ResourceTypes response and
# nothing else: it is not a SCIM service and accepts no writes. The real SCIM
# service is Strapi's /scim/v2 (iam Phase 3).

# Log method, path and status only: never the Authorization header or a body.
log_format scim_stub '$time_iso8601 $request_method $uri $status';

server {
    listen 80;
    server_name scim_stub;
    access_log /dev/stdout scim_stub;

    location = /scim/v2/ResourceTypes {
        limit_except GET { deny all; }
        default_type application/scim+json;
        alias /usr/share/nginx/scim/ResourceTypes.json;
    }

    location / {
        return 404;
    }
}
