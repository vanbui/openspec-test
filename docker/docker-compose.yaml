name: idp

# Local-only identity platform for IdamBox development. Credentials come from the
# git-ignored docker/.env (copy docker/.env.example). See docker/README.md.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: keycloak
    command:
      - start-dev
      - --import-realm
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set KC_BOOTSTRAP_ADMIN_USERNAME in docker/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD in docker/.env}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import:ro

  clamav:
    image: clamav/clamav:stable
    container_name: clamav
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-db:/var/lib/clamav

  # Disposable backend PostgreSQL, opt-in only; never shares midPoint's repository.
  iam_pg_gate:
    image: postgres:16-alpine
    profiles: ["iam-pg-gate"]
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_USER: ${IAM_PG_GATE_USER:-}
      POSTGRES_PASSWORD: ${IAM_PG_GATE_PASSWORD:-}
      POSTGRES_DB: ${IAM_PG_GATE_DB:-}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 30

  # midPoint's native PostgreSQL repository (and audit). Internal only.
  midpoint_data:
    image: postgres:16-alpine
    container_name: midpoint_data
    environment:
      POSTGRES_DB: ${MIDPOINT_DB_NAME:?set MIDPOINT_DB_NAME in docker/.env}
      POSTGRES_USER: ${MIDPOINT_DB_USER:?set MIDPOINT_DB_USER in docker/.env}
      POSTGRES_PASSWORD: ${MIDPOINT_DB_PASSWORD:?set MIDPOINT_DB_PASSWORD in docker/.env}
      POSTGRES_INITDB_ARGS: --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - midpoint_data:/var/lib/postgresql/data

  # One-shot: prepares the home volume, the repository schema and the connector
  # bundle (docker/midpoint/init.sh), then exits.
  midpoint_init:
    build:
      context: ./midpoint
    image: idambox/midpoint:4.8.14-scim2-1.2.9
    container_name: midpoint_init
    command: ["/opt/midpoint/bin/idambox-init.sh"]
    depends_on:
      midpoint_data:
        condition: service_healthy
    environment:
      MP_INIT_CFG: /opt/midpoint/var
      # For init.sh's schema probes (psql).
      PGHOST: midpoint_data
      PGDATABASE: ${MIDPOINT_DB_NAME}
      PGUSER: ${MIDPOINT_DB_USER}
      PGPASSWORD: ${MIDPOINT_DB_PASSWORD}
      MP_SET_midpoint_repository_database: postgresql
      MP_SET_midpoint_repository_jdbcUrl: jdbc:postgresql://midpoint_data:5432/${MIDPOINT_DB_NAME}
      MP_SET_midpoint_repository_jdbcUsername: ${MIDPOINT_DB_USER}
      MP_SET_midpoint_repository_jdbcPassword: ${MIDPOINT_DB_PASSWORD}
      # The dev Identity Source's SCIM token, rendered into the IdamBox SCIM
      # resource when the objects are seeded (docker/midpoint/render.sh).
      MIDPOINT_SCIM_TOKEN: ${MIDPOINT_SCIM_TOKEN:-}
    volumes:
      - midpoint_home:/opt/midpoint/var
      - ./midpoint/objects:/opt/midpoint/objects-src:ro
      - ./midpoint/hr:/opt/midpoint/hr-src:ro
      - ./midpoint/schema:/opt/midpoint/schema-src:ro

  midpoint_server:
    image: idambox/midpoint:4.8.14-scim2-1.2.9
    container_name: midpoint
    command: ["/opt/midpoint/bin/midpoint.sh", "container"]
    depends_on:
      midpoint_init:
        condition: service_completed_successfully
      midpoint_data:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      MP_SET_midpoint_repository_database: postgresql
      MP_SET_midpoint_repository_jdbcUrl: jdbc:postgresql://midpoint_data:5432/${MIDPOINT_DB_NAME}
      MP_SET_midpoint_repository_jdbcUsername: ${MIDPOINT_DB_USER}
      MP_SET_midpoint_repository_jdbcPassword: ${MIDPOINT_DB_PASSWORD}
      MP_SET_midpoint_administrator_initialPassword: ${MIDPOINT_ADMIN_PASSWORD:?set MIDPOINT_ADMIN_PASSWORD in docker/.env}
      MP_UNSET_midpoint_repository_hibernateHbm2ddl: "1"
      MP_NO_ENV_COMPAT: "1"
      # Rendered into the IdamBox SCIM resource by reload.sh / reload.ps1.
      MIDPOINT_SCIM_TOKEN: ${MIDPOINT_SCIM_TOKEN:-}
    # midPoint reaches Strapi on the host at http://host.docker.internal:1337.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/midpoint/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 30
    volumes:
      - midpoint_home:/opt/midpoint/var
      - ./midpoint/objects:/opt/midpoint/objects-src:ro
      - ./midpoint/hr:/opt/midpoint/hr-src:ro

  # Local mail catcher for Keycloak's set-password email (iam Phase 5).
  mailpit:
    image: axllent/mailpit:v1.31.5
    container_name: mailpit
    ports:
      - "127.0.0.1:8025:8025"

  # Phase 1 connector spike only: docker compose --profile scim-spike up -d
  scim_stub:
    image: nginx:1.28.0-alpine
    container_name: scim_stub
    profiles: ["scim-spike"]
    volumes:
      - ./midpoint/scim-stub/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./midpoint/scim-stub/ResourceTypes.json:/usr/share/nginx/scim/ResourceTypes.json:ro

volumes:
  keycloak_data:
  clamav-db:
    name: clamav-db
  midpoint_data:
  midpoint_home:
