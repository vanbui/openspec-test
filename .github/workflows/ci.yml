name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @csrm/web exec playwright install --with-deps chromium
      - name: Verify generated Strapi contract
        run: pnpm --filter @csrm/web api:check
      - name: Run finite web quality suite
        run: pnpm turbo run lint typecheck test build test:e2e
